<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOLTTRON AI Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 80vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 20px 20px 0 0;
        }
        
        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .model-info {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }
        
        .message {
            margin: 10px 0;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 70%;
            word-wrap: break-word;
            white-space: pre-wrap;
            font-family: 'Segoe UI', monospace;
            line-height: 1.4;
        }
        
        .user-message {
            background: #007bff;
            color: white;
            margin-left: auto;
            text-align: right;
        }
        
        .ai-message {
            background: white;
            border: 1px solid #e9ecef;
            margin-right: auto;
            font-family: 'Segoe UI', 'Courier New', monospace;
            color: #333;
        }
        
        .ai-message code {
            background: #f8f9fa;
            padding: 2px 4px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        
        .typing-indicator {
            display: none;
            margin: 10px 0;
            padding: 12px 16px;
            border-radius: 18px;
            background: white;
            border: 1px solid #e9ecef;
            max-width: 70%;
            margin-right: auto;
        }
        
        .typing-dots {
            display: inline-block;
        }
        
        .typing-dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            margin: 0 2px;
            animation: typing 1.4s infinite ease-in-out;
        }
        
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        .chat-input {
            padding: 20px;
            background: white;
            border-top: 1px solid #e9ecef;
            display: flex;
            gap: 10px;
        }
        
        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .chat-input input:focus {
            border-color: #667eea;
        }
        
        .chat-input button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        
        .chat-input button:hover {
            opacity: 0.9;
        }
        
        .chat-input button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>VOLTTRON AI Chat</h1>
            <div class="model-info">Model: {{ model_name }}</div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message ai-message">
                Hello! I'm your AI assistant. How can I help you today?
            </div>
        </div>
        
        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
            AI is typing...
        </div>
        
        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="Type your message..." autocomplete="off">
            <button id="sendButton">Send</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const typingIndicator = document.getElementById('typingIndicator');

        // Chat history for arrow key navigation
        let chatHistory = [];
        let historyIndex = -1;
        let currentDraft = '';

        // Fetch and update VOLTTRON version info
        async function updateVersionInfo() {
            try {
                const response = await fetch('/health');
                const data = await response.json();
                const modelInfo = document.querySelector('.model-info');
                if (data.volttron && data.volttron !== 'Unknown') {
                    modelInfo.textContent = `VOLTTRON: ${data.volttron} | Model: ${data.model}`;
                } else {
                    modelInfo.textContent = `Model: ${data.model}`;
                }
            } catch (error) {
                console.error('Failed to fetch version info:', error);
            }
        }

        // Update version info on load
        updateVersionInfo();

        function addMessage(content, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            messageDiv.textContent = content;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTyping() {
            typingIndicator.style.display = 'block';
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function hideTyping() {
            typingIndicator.style.display = 'none';
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            // Add to history
            chatHistory.push(message);
            historyIndex = chatHistory.length;
            currentDraft = '';

            // Add user message
            addMessage(message, true);
            messageInput.value = '';
            
            // Disable input while processing
            sendButton.disabled = true;
            messageInput.disabled = true;
            showTyping();

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                
                if (response.ok) {
                    addMessage(data.response);
                } else {
                    addMessage(`Error: ${data.detail}`);
                }
            } catch (error) {
                addMessage(`Error: Unable to connect to the server. ${error.message}`);
            } finally {
                hideTyping();
                sendButton.disabled = false;
                messageInput.disabled = false;
                messageInput.focus();
            }
        }

        sendButton.addEventListener('click', sendMessage);
        
        messageInput.addEventListener('keydown', (e) => {
            // Arrow Up - Previous message in history
            if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (chatHistory.length === 0) return;
                
                // Save current draft if at the end
                if (historyIndex === chatHistory.length) {
                    currentDraft = messageInput.value;
                }
                
                if (historyIndex > 0) {
                    historyIndex--;
                    messageInput.value = chatHistory[historyIndex];
                }
            }
            
            // Arrow Down - Next message in history
            else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (chatHistory.length === 0) return;
                
                if (historyIndex < chatHistory.length - 1) {
                    historyIndex++;
                    messageInput.value = chatHistory[historyIndex];
                } else if (historyIndex === chatHistory.length - 1) {
                    historyIndex = chatHistory.length;
                    messageInput.value = currentDraft;
                }
            }
            
            // Enter - Send message
            else if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Focus on input when page loads
        messageInput.focus();
    </script>
</body>
</html>
